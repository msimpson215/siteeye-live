<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SiteEye 360 LIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:Arial,Helvetica,sans-serif;color:#111}
img{display:block;width:100%;height:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:40}
.brand{font-weight:900;font-size:18px;display:inline-flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0}
.brand .live{background:#E31C23;color:#fff;font-size:11px;font-weight:900;padding:4px 7px;border-radius:3px;display:inline-flex;gap:5px;align-items:center}
.brand .live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.35}}
.ask{background:#111;color:#fff;border:0;border-radius:6px;padding:10px 14px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.ask .dot{width:8px;height:8px;border-radius:50%;background:#E31C23;animation:blink 1.2s infinite}

/* ONLY addition: moving banner */
.banner{background:#111;overflow:hidden}
.marquee{display:flex;width:max-content;animation:scroll 28s linear infinite}
.banner:hover .marquee{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tile{flex:0 0 150px;height:108px;overflow:hidden;border-right:2px solid #111}
.tile img{width:100%;height:100%;object-fit:cover}

/* Canva design — unchanged (top nav/static strip removed only so banner isn't doubled) */
.canva{width:100%;background:#fff}

.panel{position:fixed;inset:0;z-index:80;display:none}
.panel.open{display:block}
.panel .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.panel .sheet{position:absolute;right:0;top:0;height:100%;width:min(440px,94vw);background:#0d0e12;display:flex;flex-direction:column;border-left:1px solid #222}
.panel .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#111;color:#fff;font-weight:800}
.panel .x{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.panel iframe{flex:1;border:0;width:100%}
</style>
</head>
<body>
<div class="top">
  <div class="brand">SiteEye 360 <span class="live"><i></i>LIVE</span></div>
  <button class="ask" type="button" id="askAxon"><span class="dot"></span> Ask Axon AI</button>
</div>

<section class="banner" aria-label="Moving industry banner">
  <div class="marquee">
    <div class="tile"><img src="/images/ind-roofing.png" alt="Roofing"/></div>
    <div class="tile"><img src="/images/ind-asphalt.png" alt="Asphalt"/></div>
    <div class="tile"><img src="/images/ind-concrete.png" alt="Concrete"/></div>
    <div class="tile"><img src="/images/ind-painting.png" alt="Painting"/></div>
    <div class="tile"><img src="/images/ind-landscaping.png" alt="Landscaping"/></div>
    <div class="tile"><img src="/images/ind-excavation.png" alt="Excavation"/></div>
    <div class="tile"><img src="/images/ind-utilities.png" alt="Utilities"/></div>
    <div class="tile"><img src="/images/ind-demolition.png" alt="Demolition"/></div>
    <div class="tile"><img src="/images/ind-pressure-washing.png" alt="Pressure Washing"/></div>
    <div class="tile"><img src="/images/ind-roofing.png" alt=""/></div>
    <div class="tile"><img src="/images/ind-asphalt.png" alt=""/></div>
    <div class="tile"><img src="/images/ind-concrete.png" alt=""/></div>
    <div class="tile"><img src="/images/ind-painting.png" alt=""/></div>
    <div class="tile"><img src="/images/ind-landscaping.png" alt=""/></div>
    <div class="tile"><img src="/images/ind-excavation.png" alt=""/></div>
    <div class="tile"><img src="/images/ind-utilities.png" alt=""/></div>
    <div class="tile"><img src="/images/ind-demolition.png" alt=""/></div>
    <div class="tile"><img src="/images/ind-pressure-washing.png" alt=""/></div>
  </div>
</section>

<main class="canva">
  <img src="/images/canva-body.png?v=3" alt="SiteEye 360 LIVE Canva design"/>
</main>

<div class="panel" id="axonPanel">
  <div class="scrim" id="axonScrim"></div>
  <div class="sheet">
    <div class="hd"><span>Axon AI — your team member</span><button class="x" type="button" id="axonClose">×</button></div>
    <iframe id="axonFrame" title="Axon AI" src="about:blank" allow="microphone"></iframe>
  </div>
</div>
<script>
function openAxon(){
  const f=document.getElementById('axonFrame');
  if(!f.getAttribute('src')||f.getAttribute('src')==='about:blank') f.src='/siteeye-ai.html';
  document.getElementById('axonPanel').classList.add('open');
}
function closeAxon(){document.getElementById('axonPanel').classList.remove('open')}
document.getElementById('askAxon').onclick=openAxon;
document.getElementById('axonClose').onclick=closeAxon;
document.getElementById('axonScrim').onclick=closeAxon;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAxon()});
</script>
</body>
</html>
