<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SiteEye Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css"/>
</head>
<body>

  <main class="page">

    <!-- VISUAL DECK: filmstrip + photo slides (subliminal PowerPoint) -->
    <section class="deck-area">

      <!-- tiny slide sorter — left edge, very subtle -->
      <nav class="filmstrip" id="filmstrip" aria-label="Slides"></nav>

      <div class="stage">
        <!-- stacked paper shadow = "deck" feel -->
        <div class="paper paper-3"></div>
        <div class="paper paper-2"></div>

        <article class="slide-frame" id="slide-frame">
          <button type="button" class="hero-hit" id="hero-hit" aria-label="Open slide detail">
            <img class="hero-img" id="hero-img" src="" alt=""/>
            <span class="zoom-hint">Click photo for more</span>
            <div class="hero-caption">
              <p class="slide-tag" id="slide-tag">Slide 1</p>
              <h1 id="hero-title"></h1>
              <p id="hero-line"></p>
            </div>
          </button>
        </article>

        <footer class="deck-foot">
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="deck-controls">
            <button type="button" id="btn-back" disabled aria-label="Previous slide">◀</button>
            <span class="slide-num" id="slide-num">1 / 5</span>
            <button type="button" id="btn-fwd" aria-label="Next slide">▶</button>
          </div>
        </footer>
      </div>
    </section>

    <!-- AXON -->
    <aside class="axon-panel">
      <div class="axon-head">
        <img src="/assets/orb.svg" alt="" width="36" height="36"/>
        <div>
          <strong>Axon</strong>
          <span>Explains it like you're talking to Don next door</span>
        </div>
      </div>

      <div class="axon-chat" id="axon-chat">
        <div class="bubble them">
          Hey — I'm Axon. SiteEye Live is a camera on a pole. You watch live from your phone. Click the trade photos — asphalt, roofing, concrete, and more — or ask me anything.
        </div>
      </div>

      <button type="button" class="talk-btn" id="talk-btn">Talk to Axon</button>

      <div class="type-row">
        <input id="type-input" placeholder="Ask Don-level questions…" autocomplete="off"/>
        <button type="button" id="type-send">Send</button>
      </div>

      <details class="contact-fold">
        <summary>Want us to call you?</summary>
        <form id="contact-form">
          <input id="c-name" placeholder="Name"/>
          <input id="c-phone" placeholder="Phone"/>
          <input id="c-email" type="email" placeholder="Email"/>
          <button type="submit">Send</button>
          <p id="c-msg"></p>
        </form>
      </details>
    </aside>

  </main>

  <!-- LIGHTBOX: click photo → full detail -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-backdrop" id="lb-close"></div>
    <div class="lb-panel">
      <button type="button" class="lb-x" id="lb-x" aria-label="Close">×</button>
      <img class="lb-img" id="lb-img" src="" alt=""/>
      <div class="lb-text">
        <h2 id="lb-title"></h2>
        <p id="lb-lead"></p>
        <ul id="lb-points"></ul>
      </div>
    </div>
  </div>

  <script src="/js/site.js"></script>
</body>
</html>
