<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#000000"/>
<link rel="apple-touch-icon" href="/live/icon-192.png"/>
<title>SITE EYE 360 — Camera</title>
<link rel="manifest" href="/live/camera-manifest.json"/>
<link rel="stylesheet" href="/live/app.css"/>
</head>
<body>
<div class="cam-page">
  <header class="hd">
    <a class="ic" href="/live" aria-label="Back">&#8592;</a>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#E8C547"/><circle cx="16" cy="16" r="8" fill="#111"/><circle cx="16" cy="16" r="4" fill="#E8C547"/></svg>
      SITE <b>EYE</b> 360
    </div>
    <span class="logo" style="font-size:11px;color:#E8C547">CAMERA</span>
  </header>
  <div class="stage">
    <video id="preview" autoplay muted playsinline></video>
    <div class="hud">
      <img src="/images/hero-cam.jpg" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block"/>
      <div class="k" id="hudK">Tell Joe this code</div>
      <div class="code" id="code">————</div>
      <div class="st" id="status">Tap Start, then allow the camera.</div>
    </div>
  </div>
  <div class="bar">
    <button class="go" id="start" type="button">Start SiteEye camera</button>
    <button class="ghost" id="flip" type="button">Flip</button>
  </div>
  <div class="err" id="err" style="padding:0 12px 10px"></div>
</div>
<script>
const preview = document.getElementById('preview');
const codeEl = document.getElementById('code');
const hudK = document.getElementById('hudK');
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');
let facing = 'environment';
let stream = null, ws = null, pc = null, room = null, wake = null, relayTimer = 0, watching = false;
const ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun.relay.metered.ca:80' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turns:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
]};

function setStatus(t){ statusEl.textContent = t; }
function setErr(t){ errEl.textContent = t || ''; }
function hideCode(){
  watching = true;
  codeEl.style.display = 'none';
  hudK.textContent = 'LIVE';
  setStatus('Joe can see this camera.');
}
function showCode(){
  watching = false;
  codeEl.style.display = '';
  hudK.textContent = 'Tell Joe this code';
  if (room) setStatus('Joe left. Same code — he can join again.');
}

async function setTorch(on){
  const track = stream && stream.getVideoTracks()[0];
  if (!track) return;
  try { await track.applyConstraints({ advanced: [{ torch: !!on }] }); } catch {}
}

async function getCam(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  const tryList = [
    { video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: true },
    { video: true, audio: true }
  ];
  let last = null;
  for (const opts of tryList){
    try {
      stream = await navigator.mediaDevices.getUserMedia(opts);
      preview.srcObject = stream;
      await preview.play().catch(() => {});
      return;
    } catch (e) { last = e; }
  }
  throw last || new Error('Camera blocked');
}

function signal(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/live-signal`);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'create' }));
  ws.onclose = () => setStatus('Connection dropped. Tap Start again.');
  ws.onerror = () => setErr('Could not reach SiteEye. Stay on this page and try Start again.');
  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'created'){
      room = msg.room;
      codeEl.textContent = room;
      setStatus('Waiting for Joe to open Watch and type this code.');
    }
    if (msg.type === 'peer-joined'){
      setStatus('Joe is connecting…');
      hideCode();
      startRelay();
      await startCall();
    }
    if (msg.type === 'answer' && pc){
      await pc.setRemoteDescription(msg.payload);
      hideCode();
    }
    if (msg.type === 'ice' && pc && msg.payload){
      try { await pc.addIceCandidate(msg.payload); } catch {}
    }
    if (msg.type === 'peer-left'){
      showCode();
      stopRelay();
      if (pc){ pc.close(); pc = null; }
    }
  };
}

function stopRelay(){
  if (relayTimer){ clearTimeout(relayTimer); relayTimer = 0; }
}
function startRelay(){
  stopRelay();
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  function tick(){
    if (!watching || !ws || ws.readyState !== 1 || !preview.videoWidth){
      relayTimer = setTimeout(tick, 200);
      return;
    }
    canvas.width = 640;
    canvas.height = Math.max(1, Math.round(640 * preview.videoHeight / preview.videoWidth));
    ctx.drawImage(preview, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => {
      if (blob && ws && ws.readyState === 1) blob.arrayBuffer().then((buf) => { try { ws.send(buf); } catch {} });
    }, 'image/jpeg', 0.55);
    relayTimer = setTimeout(tick, 140);
  }
  tick();
}

async function startCall(){
  if (pc){ pc.close(); pc = null; }
  pc = new RTCPeerConnection(ICE);
  const ch = pc.createDataChannel('ctrl');
  ch.onmessage = (ev) => {
    if (ev.data === 'torch-on') setTorch(true);
    if (ev.data === 'torch-off') setTorch(false);
  };
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.onicecandidate = (ev) => {
    if (ev.candidate && ws && ws.readyState === 1){
      ws.send(JSON.stringify({ type: 'ice', payload: ev.candidate }));
    }
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  ws.send(JSON.stringify({ type: 'offer', payload: pc.localDescription }));
}

async function start(){
  setErr('');
  try {
    await getCam();
    if ('wakeLock' in navigator){
      try { wake = await navigator.wakeLock.request('screen'); } catch {}
    }
    if (!ws || ws.readyState > 1) signal();
    else setStatus(room ? 'Waiting for Joe…' : 'Starting…');
  } catch {
    setErr('Allow the camera and the microphone when the phone asks.');
  }
}

document.getElementById('start').onclick = start;
document.getElementById('flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try {
    await getCam();
    if (pc && stream){
      const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      const next = stream.getVideoTracks()[0];
      if (sender && next) await sender.replaceTrack(next);
    }
  } catch {
    setErr('Could not flip camera.');
  }
};
</script>
</body>
</html>
